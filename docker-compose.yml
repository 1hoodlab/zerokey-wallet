services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zerokey
      POSTGRES_PASSWORD: zerokey_local
      POSTGRES_DB: zerokey_wallet
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zerokey']
      interval: 5s
      retries: 10

volumes:
  pgdata:
